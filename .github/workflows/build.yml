name: Build static ffmpeg

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v3
      - name: Build in Docker (musl static binary)
        run: |
          docker build --build-arg ARCH=$ARCH -t ffmpeg-linux-$ARCH .
          docker create --name ffmpeg-extract-$ARCH ffmpeg-linux-$ARCH
          docker cp ffmpeg-extract-$ARCH:/build/artifacts/. artifacts/
          docker rm ffmpeg-extract-$ARCH
      - name: Smoke test
        run: |
          BIN=$(ls artifacts/ffmpeg-*-audio-${ARCH}-linux-gnu/bin/ffmpeg)
          "$BIN" -version
          echo "Compatibility:"
          "$BIN" -version | tr ' ' '\n' | grep OACOMPAT || true
          echo "Probe test:"
          python3 -c "import wave,struct,math; w=wave.open('tone.wav','w'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b''.join(struct.pack('<h',int(8000*math.sin(2*math.pi*300*i/44100))) for i in range(44100))); w.close()"
          "$BIN" -i tone.wav -c:a aac -f ipod -metadata narrated_by="CI Test" out.m4b -y
          "$BIN" -probe out.m4b | tee probe.json
          grep -q '"format_name"' probe.json
          grep -q "CI Test" probe.json
          echo "Probe OK: -probe emitted JSON and custom audiobook tag round-tripped"
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-${{ env.ARCH }}
          path: artifacts/

  package-windows:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch:
          - x86_64
          - arm64
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update -y && \
          sudo apt-get install -y yasm nasm subversion wget gawk pkg-config
      - name: Install x86_64 compiler
        if: env.ARCH == 'x86_64'
        run: |
          sudo apt-get update -y && \
          sudo apt-get install -y mingw-w64 libz-mingw-w64-dev
      - name: Install ARM64 compiler (llvm-mingw)
        if: env.ARCH == 'arm64'
        run: |
          wget https://github.com/mstorsjo/llvm-mingw/releases/download/20231128/llvm-mingw-20231128-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar -xf llvm-mingw-20231128-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$PWD/llvm-mingw-20231128-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH
      - name: Build
        run: ./build-windows.sh
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-${{ env.ARCH }}
          path: artifacts/

  package-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        # https://developer.apple.com/documentation/apple-silicon/building-a-universal-macos-binary#Update-the-Architecture-List-of-Custom-Makefiles
        target:
          - x86_64-apple-macos10.9
          - arm64-apple-macos11
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: brew install yasm nasm subversion
      - name: Build
        run: ./build-macos.sh
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: artifacts/

  package-macos-universal:
    runs-on: macos-latest
    needs: package-macos
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*-apple-*
          path: artifacts/
      - name: Create universal binaries
        run: |
          mkdir -p universal/bin
          for bin in ffmpeg ffprobe ffplay; do
            x86_bin=$(ls artifacts/ffmpeg-x86_64-apple-macos10.9/ffmpeg-*-audio-x86_64-apple-macos10.9/bin/$bin 2>/dev/null || true)
            arm_bin=$(ls artifacts/ffmpeg-arm64-apple-macos11/ffmpeg-*-audio-arm64-apple-macos11/bin/$bin 2>/dev/null || true)
            if [ -f "$x86_bin" ] && [ -f "$arm_bin" ]; then
              lipo -create "$x86_bin" "$arm_bin" -output "universal/bin/$bin"
              echo "Created universal binary: $bin"
            fi
          done
      - name: Compatibility report
        run: |
          BIN=universal/bin/ffmpeg
          lipo -info "$BIN"
          otool -l "$BIN" | grep -E -A3 'LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION' \
            | grep -E '(minos|version) '
          "$BIN" -version | tr ' ' '\n' | grep OACOMPAT || true
      - name: Archive universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-universal-macos
          path: universal/

  release:
    runs-on: ubuntu-latest
    needs:
      - package-linux
      - package-windows
      - package-macos-universal
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Make tarballs
        run: |
          mkdir artifacts/release/
          cd artifacts/
          for dir in ffmpeg-*/ffmpeg-*
          do
            name=$(basename $dir)
            tar czf release/$name.tar.gz -C $(dirname $dir) $name
          done

          mkdir apps
          mkdir apps/win_x86_64
          mkdir apps/win_arm64
          mkdir apps/mac
          mkdir apps/linux_x86_64
          mkdir apps/linux_aarch64

          cp ./ffmpeg-windows-x86_64/ffmpeg-*-audio-x86_64-win/bin/ff* apps/win_x86_64/
          cp ./ffmpeg-windows-arm64/ffmpeg-*-audio-aarch64-win/bin/ff* apps/win_arm64/
          cp ./ffmpeg-linux-x86_64/ffmpeg-*-audio-x86_64-linux-gnu/bin/ff* apps/linux_x86_64
          cp ./ffmpeg-linux-arm64/ffmpeg-*-audio-arm64-linux-gnu/bin/ff* apps/linux_aarch64
          cp ./ffmpeg-universal-macos/bin/ff* apps/mac/
   
      # upload this so it is available to download in action artifacts.    
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apps
          path: artifacts/apps

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: artifacts/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
